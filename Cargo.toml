[workspace]
members = [
  "crates/ace-core",
  "crates/ace-analysis",
  "crates/ace-codecs",
  "crates/ace-planner",
  "crates/ace-format",
  "crates/ace-engine",
  "crates/ace-cli",
  "crates/ace-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/ace"

[workspace.dependencies]
thiserror = "2"
crc32c = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
criterion = "0.5"
proptest = "1"
